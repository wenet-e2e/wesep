dataloader_args:
  batch_size: 1
  drop_last: true
  num_workers: 6
  pin_memory: true
  prefetch_factor: 6

dataset_args:
  resample_rate: &sr 16000
  sample_num_per_epoch: 0
  shuffle: true
  shuffle_args:
    shuffle_size: 2500
  whole_utt: true
  chunk_len: 48000
  chunk_random_start: false
  chunk_short_policy: keep  # keep | pad
  filter_len: false
  cues:
    textual:
      use: true
      required: true
  cue_processing:
    textual:
      input: text  # text | dae_phoneme
      # text encodes in workers; dae_phoneme reads precomputed per-word IDs.
      boundary: contained  # contained | overlap, when word times are present
      selection:
        train:
          type: random_span  # prefix | random_span | all
          word_range: [2, 6]
        val:
          type: random_span
          word_range: [2, 6]
          seed: 42  # Fix word count and position independently for each target.
        # Omitted test selection reads all words from the selected cue record.
      # Encoding/vocabulary are fixed by the DAE KCE checkpoint; do not change.
      # Shared with dae_kce.tokenizer below.
      encoding: &textual_encoding
        type: dae_phoneme
        phoneme_map: ./dae_kce/phoneme2int.txt
        lexicon: ./dae_kce/word2lexicon.txt

enable_amp: false
exp_dir: exp/BSRNN_TEXTUAL
gpus: [0, 1]
log_batch_interval: 100

loss:
  - type: SISDR
    output: speech
    target: wav_target
    weight: 1.0
    stages: [train, val]

model:
  tse_model: TSE_BSRNN_TEXTUAL
model_args:
  tse_model:
    separator:
      sr: *sr
      win: 512
      stride: 128
      feature_dim: &feature_dim 128
      num_repeat: 6
      causal: false
      nspk: 1
    textual:
      features:
        dae_kce:
          enabled: true
          padding_id: 0
          bos_id: 71
          eos_id: 72
          # Direct text CLI input uses this tokenizer; KCE receives phoneme IDs.
          tokenizer: *textual_encoding
          adapter:
            output_dim: *feature_dim
            num_layers: 3
          fusion: FiLM  # additive | concat | multiply | FiLM
          multi_fuse: true
          # Download from https://huggingface.co/GnafiY/DAE-TSE and keep
          # model.yaml and data.yaml beside the pretrained checkpoint.
          pretrained: ./dae_kce/epoch_149.pt

model_init:
  tse_model: null

num_avg: 5
num_epochs: 150

optimizer:
  tse_model: Adam
optimizer_args:
  tse_model:
    lr: 0.001
    weight_decay: 0.0001

clip_grad: 5.0
save_epoch_interval: 0

scheduler:
  tse_model:
    warmup:
      enabled: false
      by: epoch
      epochs: 0
      start_factor: 0.0
  ######## ExponentialDecrease Scheduler ####
    # name: ExponentialDecrease
    # interval: step
    # args:
    #   final_lr: 2.5e-05
  ######## Fiexed LR Scheduler ########
    # name: none
  ######## Plateau Scheduler ########
    name: PlateauHalf
    interval: validation
    args:
      patience: 3
      factor: 0.5
      min_delta: 0.0
      min_lr: 0.0
      early_stop_patience: 6
      early_stop: true

seed: 42
